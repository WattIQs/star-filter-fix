<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seu código Star Filter</title>
  </head>
  <body style="margin:0;background:#0d1320;color:#f5f7fb;font-family:Arial,Helvetica,sans-serif;">
    <div style="padding:48px 18px;">
      <div style="max-width:520px;margin:0 auto;background:#151d2d;border:1px solid #303b52;border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.28);">
        <div style="text-align:center;font-size:12px;font-weight:700;letter-spacing:4px;color:#f2c14e;">STAR FILTER</div>
        <h1 style="margin:28px 0 10px;text-align:center;font-size:28px;line-height:1.2;">Confirme seu e-mail</h1>
        <p style="margin:0 auto 28px;max-width:410px;text-align:center;color:#aeb8ca;font-size:15px;line-height:1.7;">Use o código abaixo para confirmar sua conta. Se você não solicitou este cadastro, pode ignorar este e-mail.</p>
        <div style="margin:0 auto 28px;width:max-content;min-width:220px;padding:18px 24px;border-radius:18px;background:#0d1320;border:1px solid #4a5872;text-align:center;">
          <div style="font-size:36px;font-weight:800;letter-spacing:10px;color:#f2c14e;">{{ .Token }}</div>
        </div>
        <p style="margin:0;text-align:center;color:#7f8ba0;font-size:12px;line-height:1.6;">Este código é de uso único e expira em pouco tempo.</p>
        <div style="margin-top:30px;padding-top:22px;border-top:1px solid #303b52;text-align:center;color:#667287;font-size:11px;">Star Filter · Autenticação segura</div>
      </div>
    </div>
  </body>
</html>
